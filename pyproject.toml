[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docka-check"
version = "0.1.1"
description = "What each AI client sees on your MCP server. No model calls; never a verdict."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
docka-check = "docka_check.cli:main"

[tool.setuptools]
packages = ["docka_check", "docka_check.t5"]

[tool.setuptools.package-data]
docka_check = ["rules.json"]
"docka_check.t5" = ["README.md", "fixtures/*.json"]
