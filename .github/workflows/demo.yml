# Demo: the Action against our own test server, started inside the job on 127.0.0.1. No vendor is called.
name: demo
on:
  workflow_dispatch:
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Start the test server (three failure shapes on)
        run: |
          echo "DEMO_TOKEN=$(python -c 'import secrets; print(secrets.token_hex(16))')" >> "$GITHUB_ENV"
          echo "::add-mask::$(tail -1 "$GITHUB_ENV" | cut -d= -f2)"
      - run: |
          nohup python testserver/shapes.py --shape schema_copilot --shape get403 --shape outschema_mismatch \
            --static-token-env DEMO_TOKEN > shapes.log 2>&1 &
          sleep 2
          cat shapes.log
      - uses: ./
        with:
          url: http://127.0.0.1:8941/mcp
          token: ${{ env.DEMO_TOKEN }}
          calls-config: examples/calls.json
          comment: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
